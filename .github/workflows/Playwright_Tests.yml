name: Testing Data Run
on:
  
  workflow_dispatch:
  #schedule:
    #- cron: '5 0 * * *'

jobs:
  Test:
    runs-on: windows-latest

    env:
      TZ: Asia/Kolkata
      
    
    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install

      - name: ▶️ Run Member Tests
        run: npx playwright test loginpage.spec.ts
        continue-on-error: true

      
